

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Connect</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <a class="brand" href="index.html">Connect<span>.</span></a>
    <form class="auth-card" id="registerForm">
      <h1>Create your account</h1>
      <p>Join Connect and start conversations.</p>

      <label for="username">Username</label>
      <input id="username" name="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" maxlength="72" required>

      <button class="btn auth-submit" type="submit">Create account</button>
      <p id="authMessage" role="status"></p>
      <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
    </form>
  </main>
</body>
</html>
